# =============================================================
# nixpacks.toml — Configuração de Build para EasyPanel / Railway
# Instrui o Nixpacks a construir o backend Node.js dentro de /backend
# =============================================================

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["cd backend && npm ci --only=production"]

[phases.build]
cmds = []

[start]
cmd = "node backend/src/app.js"
